<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Web Switcher · Checking this move</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="route.js"></script>
</head>
<body class="gate-body">
  <main class="gate card">
    <img class="brand-icon" src="spider.svg" alt="" width="48" height="48">
    <p class="eyebrow">WEB SWITCHER</p>
    <h1 id="title">Checking this move</h1>
    <p id="message" role="status">Checking your saved mapping before opening its destination.</p>
    <p id="destination" hidden></p>
    <div class="actions">
      <button id="route-permission" hidden>Allow next destination check</button>
      <button id="homepage" hidden>Open destination homepage</button>
      <button id="manage" class="secondary">Manage mappings</button>
    </div>
  </main>
</body>
</html>

<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
  <title>Web Switcher · Finding the current address</title>
  <link rel="stylesheet" href="styles.css"><script type="module" src="continuity-gate.js"></script>
</head><body class="gate-body"><main class="gate card">
  <img src="spider.svg" alt="" width="48" height="48">
  <p class="eyebrow">FOLLOW THE THREAD</p><h1 id="continuity-title">Finding the current address</h1>
  <p id="continuity-message" role="status">Checking the site's declared moves and previously learned successors.</p>
  <ol id="continuity-chain"></ol>
  <p id="continuity-target" class="origin-text"></p>
  <div class="actions"><button id="continuity-permission" hidden>Allow checking the next domain</button><button id="continuity-confirm" hidden>Open discovered homepage</button><button id="continuity-settings" class="secondary">Manage followed sites</button></div>
  <p class="hint">Source-declared moves are observations, not independent proof of ownership or content safety. Page parameters are never transferred to another domain.</p>
</main></body></html>

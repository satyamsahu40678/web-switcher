name: Routing prototype

on:
  push:
    branches: [main, feat/local-routing-prototype]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check package and pure routing rules
        run: |
          npm run check
          npm test
      - name: Install reference Chromium
        run: npx playwright install --with-deps chromium --no-shell
      - name: Run original nine-check browser experiment
        id: research
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e 'import {chromium} from "playwright"; process.stdout.write(chromium.executablePath())')"
          printf 'CHROMIUM_PATH=%s\n' "$CHROMIUM_PATH" >> "$GITHUB_ENV"
          npm run test:research
      - name: Run prototype browser tests
        if: ${{ !cancelled() }}
        id: browser
        run: npm run test:browser
      - name: Run HTTP and signature experiments
        if: ${{ !cancelled() }}
        run: |
          python -m pip install -r research/requirements.txt
          python research/redirect_lab.py
      - name: Package extension
        if: ${{ success() }}
        run: npm run package
      - name: Preserve results and installable prototype
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-switcher-prototype
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.zip
            test-results/
            research/browser_gate_results.json
            research/redirect_lab_results.json

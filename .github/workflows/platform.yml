name: Web Switcher platform

on:
  push:
    branches: [main, feat/web-switcher-platform]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix apps/web ci --no-audit --no-fund
      - name: Test and package extension, contracts, and web UI
        run: |
          npm test
          npm run check
          infra/backup/test.sh
          python3 infra/deploy/test-deploy.py
          npm --prefix apps/web run build
          npm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-switcher-development-packages
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.zip
            apps/web/dist/
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify API and isolated fetcher
        run: |
          ./backend/mvnw -f backend/pom.xml --batch-mode --no-transfer-progress verify
          ./backend/mvnw -f fetcher/pom.xml --batch-mode --no-transfer-progress verify
      - name: Preserve Java test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-test-results
          retention-days: 14
          if-no-files-found: warn
          path: |
            backend/target/surefire-reports/
            fetcher/target/surefire-reports/
  internet-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Build the separate Internet discovery image
        run: docker build -f online-discovery/Dockerfile -t web-switcher-internet:test .
      - name: Verify final-image authentication, persistence and unavailable behavior without egress
        run: node tests/internet-container.mjs
      - name: Preserve discovery image acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: internet-discovery-image-results
          retention-days: 14
          if-no-files-found: warn
          path: test-results/internet-container.json
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: |
          npm ci --no-audit --no-fund
          npm --prefix apps/web ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium --no-shell
      - name: Extension and web UI browser acceptance
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e 'import {chromium} from "playwright"; process.stdout.write(chromium.executablePath())')"
          failed=0
          npm run test:browser || failed=1
          for suite in tests/continuity-probe-browser.mjs tests/continuity-ui.mjs tests/continuity-browser.mjs tests/internet-ui.mjs tests/internet-browser.mjs tests/shared-follow-browser.mjs; do
            node "$suite" || failed=1
          done
          npm --prefix apps/web run test:browser || failed=1
          exit "$failed"
      - name: Preserve current browser results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chromium-acceptance-results
          retention-days: 14
          if-no-files-found: warn
          path: test-results/
  live-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci --no-audit --no-fund
      - run: ./backend/mvnw -f backend/pom.xml --batch-mode --no-transfer-progress -DskipTests package
      - name: Verify the live Java API and browser-compatible signature contract
        shell: bash
        run: |
          set -euo pipefail
          demo_dir="$(mktemp -d "$RUNNER_TEMP/web-switcher-api-XXXXXXXX")"
          api_jar="$GITHUB_WORKSPACE/backend/target/web-switcher-api-0.2.0.jar"
          mkdir -p test-results
          (
            cd "$demo_dir"
            exec java -jar "$api_jar" --spring.profiles.active=demo --server.address=127.0.0.1 --server.port=8080
          ) > test-results/live-api.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true; wait "$demo_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/health/ready >/dev/null; then
              break
            fi
            kill -0 "$demo_pid" 2>/dev/null || { cat test-results/live-api.log; exit 1; }
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8080/health/ready >/dev/null
          node tests/http-demo.mjs
      - name: Preserve live API evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-api-acceptance-results
          retention-days: 14
          if-no-files-found: warn
          path: |
            test-results/http-demo.json
            test-results/live-api.log
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: webswitcher_test
          POSTGRES_PASSWORD: ci-ephemeral-database-only
          POSTGRES_DB: webswitcher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webswitcher_test -d webswitcher_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify the real PostgreSQL schema and API transactions
        env:
          TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/webswitcher_test
          TEST_DATABASE_USER: webswitcher_test
          TEST_DATABASE_PASSWORD: ci-ephemeral-database-only
        run: ./backend/mvnw -f backend/pom.xml --batch-mode --no-transfer-progress verify
      - name: Verify append-only releases, separated database roles and repeatable bootstrap
        run: python3 infra/deploy/test-db-grants.py
      - name: Verify opt-in discovery worker grants and scoped budgets
        run: python3 infra/deploy/test-worker-grants.py
      - name: Preserve PostgreSQL test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postgres-test-results
          retention-days: 14
          if-no-files-found: warn
          path: |
            backend/target/surefire-reports/
            test-results/worker-grants.json
  stack-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - name: Install locked browser test dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix apps/web ci --no-audit --no-fund
          npx playwright install --with-deps chromium --no-shell
      - name: Build and start the real application containers
        run: |
          docker compose -p web-switcher-ci -f infra/compose/local.yml build
          docker compose -p web-switcher-ci -f infra/compose/local.yml up -d --no-build
      - name: Verify readiness, HTTP contracts, and real browser user journeys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          for attempt in $(seq 1 60); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8088/health/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail --max-time 5 http://127.0.0.1:8088/health/ready >/dev/null
          export CHROMIUM_PATH="$(node --input-type=module -e 'import {chromium} from "playwright"; process.stdout.write(chromium.executablePath())')"
          API_BASE=http://127.0.0.1:8088 node tests/http-demo.mjs
          LIVE_WEB_BASE=http://127.0.0.1:8088 node apps/web/tests/e2e-browser.mjs
          API_BASE=http://127.0.0.1:8088 node tests/catalog-load.mjs
          curl --silent --fail --max-time 5 http://127.0.0.1:8088/v1/catalog/current > test-results/catalog-before-restart.jws
          docker compose -p web-switcher-ci -f infra/compose/local.yml restart api
          for attempt in $(seq 1 60); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8088/health/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail --max-time 5 http://127.0.0.1:8088/v1/catalog/current > test-results/catalog-after-restart.jws
          cmp test-results/catalog-before-restart.jws test-results/catalog-after-restart.jws
      - name: Exercise real encrypted PostgreSQL backup and clean recovery
        shell: bash
        run: |
          set -euo pipefail
          docker build -f infra/backup/Dockerfile.drill -t web-switcher-backup-drill:local .
          api_image="$(docker compose -p web-switcher-ci -f infra/compose/local.yml images -q api)"
          test -n "$api_image"
          RESTORE_DRILL_API_IMAGE="$api_image" python3 infra/backup/drill.py
          WORKER_TEST_API_IMAGE="$api_image" python3 infra/deploy/test-worker-grants.py
      - name: Capture container evidence and clean the disposable stack
        if: always()
        shell: bash
        run: |
          mkdir -p test-results
          docker compose -p web-switcher-ci -f infra/compose/local.yml logs --no-color > test-results/container-stack.log 2>&1 || true
          docker compose -p web-switcher-ci -f infra/compose/local.yml down --volumes --remove-orphans
      - name: Preserve full stack evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stack-end-to-end-results
          retention-days: 14
          if-no-files-found: warn
          path: test-results/

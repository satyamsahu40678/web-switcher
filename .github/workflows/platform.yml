name: Web Switcher platform

on:
  push:
    branches: [main, feat/web-switcher-platform]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix apps/web ci --no-audit --no-fund
      - name: Test and package extension, contracts, and web UI
        run: |
          npm test
          node --test packages/security/*.test.mjs
          npm run check
          infra/backup/test.sh
          npm --prefix apps/web run build
          npm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-switcher-development-packages
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.zip
            apps/web/dist/
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify API and isolated fetcher
        run: |
          ./backend/mvnw -f backend/pom.xml --batch-mode --no-transfer-progress verify
          ./backend/mvnw -f fetcher/pom.xml --batch-mode --no-transfer-progress verify
      - name: Preserve Java test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-test-results
          retention-days: 14
          if-no-files-found: warn
          path: |
            backend/target/surefire-reports/
            fetcher/target/surefire-reports/
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium --no-shell
      - run: npm run test:browser
      - name: Preserve current browser results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chromium-acceptance-results
          retention-days: 14
          if-no-files-found: warn
          path: test-results/
